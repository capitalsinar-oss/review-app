<title>Review Grader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
  --ink:#2B2140; --cream:#FFF8EE; --yellow:#FFD84D; --mint:#7FE0B8; --lav:#BFA8FF; --pink:#FF7EB3; --lilac:#EDE6FF; --mute:#6B5E7B; --mute2:#4A3D5C; --purple:#5A3E8A; --white:#FFFFFF; --sand:#F1ECE3; --admin:#F4F0FA;
  --airbnb:#FF5A5F; --booking:#003580; --trip:#287DFA; --google:#34A853;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:'Nunito',sans-serif;background:var(--cream);color:var(--ink);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
a{color:var(--ink)} a:hover{color:var(--purple)}
button{font-family:inherit;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
input,select{font-family:inherit;color:var(--ink)}
.screen{display:none;min-height:100%;max-width:480px;margin:0 auto;padding:24px 20px 28px;padding-top:calc(24px + env(safe-area-inset-top,0px));flex-direction:column;gap:16px}
.screen.on{display:flex}
.screen.withnav{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.fred{font-family:'Fredoka',sans-serif;font-weight:700}
h1{margin:0;font-family:'Fredoka',sans-serif;font-weight:700;font-size:30px;line-height:1.1}
h2{margin:0;font-family:'Fredoka',sans-serif;font-weight:700;font-size:20px}
.sub{font-size:14px;font-weight:700;color:var(--mute)}
.pill{background:var(--ink);color:var(--cream);border-radius:20px;padding:6px 12px;font-size:14px;font-weight:800;letter-spacing:.3px}
.card{background:var(--white);border:3px solid var(--ink);border-radius:28px;padding:18px}
.card.shadow{box-shadow:0 6px 0 var(--ink)}
.card.thin{border-width:2.5px;border-radius:24px;padding:14px 16px}
.btn{min-height:56px;border:3px solid var(--ink);border-radius:20px;background:var(--ink);color:var(--yellow);font-family:'Fredoka',sans-serif;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;box-shadow:0 5px 0 var(--pink);width:100%}
.btn.plain{background:var(--white);color:var(--ink);box-shadow:none;font-size:17px}
.btn.flat{box-shadow:none}
.link{background:none;border:0;padding:0;font-size:15px;font-weight:800;text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center;color:var(--ink)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:8px}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:15px;font-weight:800}
.select,.input{height:52px;border:2.5px solid var(--ink);border-radius:16px;padding:0 14px;font-size:17px;font-weight:700;background:var(--cream);width:100%}
.input.pin{height:56px;font-size:26px;letter-spacing:14px;padding:0 18px}
.note{background:var(--lilac);border-radius:20px;padding:14px 16px;font-size:15px;line-height:1.4}
.err{color:#B3261E;font-size:14px;font-weight:800;min-height:1.2em}
.err:empty{display:none}
.dot{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:5px;vertical-align:middle}
.steps{display:flex;gap:8px}
.steps div{flex:1 1 0;background:var(--white);border:2.5px solid var(--ink);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:4px}
.steps b{font-family:'Fredoka',sans-serif;font-size:20px;font-weight:700}
.steps span{font-size:13px;font-weight:700;line-height:1.25}
.hero{position:relative;height:250px;background:var(--lav);border:3px solid var(--ink);border-radius:32px;box-shadow:0 6px 0 var(--ink);overflow:hidden}
.hero .p{position:absolute}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(350px,calc(100% - 40px));height:64px;background:var(--ink);border-radius:32px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;z-index:20}
.nav button{background:none;border:0;color:var(--cream);font-size:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:44px;min-height:44px;justify-content:center}
.nav button.on{color:var(--yellow)}
.nav .star{width:60px;height:60px;border-radius:30px;background:var(--yellow);border:3px solid var(--ink);box-shadow:0 4px 0 var(--pink);display:flex;align-items:center;justify-content:center;margin-top:-30px;color:var(--ink)}
.stars5{align-self:flex-start;display:flex;gap:4px;background:var(--white);border:2.5px solid var(--ink);border-radius:16px;padding:5px 10px}
.chips2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.chips2 span{background:var(--cream);border-radius:12px;padding:7px 10px;font-size:13px;font-weight:700;display:flex;justify-content:space-between}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px}
.tabs button{height:40px;border:2.5px solid var(--ink);border-radius:14px;background:var(--white);font-size:14px;font-weight:800;color:var(--ink)}
.tabs button.on{background:var(--ink);color:var(--cream)}
.goal{display:flex;flex-direction:column;gap:6px}
.goal .bar{height:8px;background:var(--sand);border-radius:4px;overflow:hidden}
.goal .bar i{display:block;height:100%;border-radius:4px}
.goal .g{font-size:13px;font-weight:700;color:var(--mute)}
.sheetbg{position:fixed;inset:0;background:rgba(43,33,64,.55);z-index:30;display:none}
.sheetbg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--cream);border-radius:28px 28px 0 0;border:3px solid var(--ink);border-bottom:0;padding:14px 20px calc(24px + env(safe-area-inset-bottom,0px));z-index:31;display:none;flex-direction:column;gap:14px;animation:rise .35s ease-out both;max-height:88vh;overflow:auto}
.sheet.on{display:flex}
.sheet .grab{width:44px;height:5px;background:var(--ink);border-radius:3px;margin:0 auto}
.drop{background:var(--mint);border:2.5px dashed var(--ink);border-radius:20px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:16px;text-align:center;cursor:pointer}
.drop b{font-size:16px;font-weight:800}
.drop span{font-size:13px;font-weight:700;color:var(--mute2)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{height:70px;width:auto;max-width:140px;object-fit:cover;border-radius:12px;border:2px solid var(--ink)}
.chdots{display:flex;flex-wrap:wrap;gap:6px}
.chdots span{background:var(--white);border-radius:12px;padding:5px 10px;font-size:12px;font-weight:800}
.overlay{position:fixed;inset:0;z-index:50;background:var(--cream);display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
.overlay.on{display:flex}
.overlay .box{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:320px}
.overlay .ring{width:84px;height:84px;border-radius:50%;border:4px solid var(--sand);border-top-color:var(--pink);animation:spin 1s linear infinite}
.overlay .prog{width:220px;height:10px;background:var(--sand);border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.overlay .prog i{display:block;height:100%;width:0;background:var(--yellow);transition:width 1s linear}
.pay{background:var(--mint);border:3px solid var(--ink);border-radius:22px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pay.yellow{background:var(--yellow)}
.pay b{font-size:16px;font-weight:800;line-height:1.3}
.pay .amt{font-family:'Fredoka',sans-serif;font-size:22px;font-weight:700;white-space:nowrap}
.quote{background:var(--cream);border-radius:14px;padding:10px 12px;font-size:15px;font-style:italic;line-height:1.45}
.tile{border:2.5px solid var(--ink);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:13px;font-weight:800}
.tile .amt{font-family:'Fredoka',sans-serif;font-size:20px;font-weight:700}
.tile span{font-size:13px;font-weight:700;line-height:1.25}
.win{display:flex;gap:12px;align-items:center;background:var(--white);border:2.5px solid var(--ink);border-radius:18px;padding:10px 12px}
.win.pending{border-style:dashed;border-color:var(--mute)}
.win .g{width:40px;height:40px;border-radius:20px;background:var(--yellow);border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-weight:700;flex-shrink:0}
.win.pending .g{background:var(--sand);border-style:dashed;border-color:var(--mute)}
.win .t{flex:1;display:flex;flex-direction:column;font-size:15px;font-weight:800}
.win .t small{font-size:13px;font-weight:700;color:var(--mute)}
.win .t small.named{color:#D6266F}
.win .amt{font-family:'Fredoka',sans-serif;font-size:18px;font-weight:700;white-space:nowrap}
.paydays{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.paydays div{border:2.5px solid var(--ink);border-radius:16px;padding:10px;background:var(--white);display:flex;flex-direction:column;gap:2px}
.paydays div.next{background:var(--ink);color:var(--yellow)}
.paydays b{font-family:'Fredoka',sans-serif;font-size:17px;font-weight:700}
.paydays span{font-size:12px;font-weight:700}
.admin{background:var(--admin)}
.badge{width:44px;height:44px;border-radius:22px;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-size:22px;font-weight:700;flex-shrink:0}
.badge.A{background:var(--yellow)} .badge.B{background:var(--lav)} .badge.C{background:var(--pink)}
.tag{background:var(--sand);border-radius:10px;padding:4px 8px;font-size:12px;font-weight:800}
.tag.warn{border:2px dashed var(--mute);background:transparent;color:var(--mute)}
mark{color:var(--ink);border-radius:5px;padding:1px 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hs{background:#DDF7EC}.hg{background:#F7E3B0}.hl{background:#EDE6FF}
.ha{background:#F9D9C8;text-decoration:underline wavy #C4643F;text-underline-offset:3px}
.hf{background:transparent;border:2px dashed var(--mute);color:var(--mute)}
.sw{display:inline-block;width:18px;height:12px;border-radius:4px;border:1.5px solid var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;font-weight:800}
.legend span{display:flex;align-items:center;gap:5px}
.checks{background:var(--cream);border:2px solid var(--ink);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:600;line-height:1.35}
.abtn{min-height:44px;border-radius:14px;border:2.5px solid var(--ink);font-family:'Fredoka',sans-serif;font-size:15px;font-weight:600;padding:0 14px;flex:1}
.abtn.dark{background:var(--ink);color:var(--yellow)}
.abtn.light{background:var(--white);color:var(--ink)}
.abtn.pink{background:var(--pink);color:var(--ink)}
.mention{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;padding:4px 0}
.mention input{width:20px;height:20px}
.small{font-size:13px;font-weight:600;color:var(--mute)}
.confetti{position:absolute;top:0;width:9px;height:14px;border-radius:3px;animation:fall 4.2s linear infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes rise{0%{transform:translateY(40px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dance{0%{transform:rotate(-9deg) translateY(0)}25%{transform:rotate(0deg) translateY(-14px)}50%{transform:rotate(9deg) translateY(0)}75%{transform:rotate(0deg) translateY(-14px)}100%{transform:rotate(-9deg) translateY(0)}}
@keyframes armL{0%,100%{transform:rotate(25deg)}50%{transform:rotate(-35deg)}}
@keyframes armR{0%,100%{transform:rotate(-35deg)}50%{transform:rotate(25deg)}}
@keyframes kickL{0%,100%{transform:rotate(0deg)}50%{transform:rotate(22deg)}}
@keyframes kickR{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(0deg)}}
@keyframes fall{0%{transform:translateY(-40px) rotate(0deg)}100%{transform:translateY(1040px) rotate(480deg)}}
@keyframes pop{0%{opacity:0;transform:scale(.8)}70%{opacity:1;transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes clapL{0%,100%{transform:translateX(0) rotate(-12deg)}50%{transform:translateX(9px) rotate(-4deg)}}
@keyframes clapR{0%,100%{transform:translateX(0) rotate(12deg)}50%{transform:translateX(-9px) rotate(4deg)}}
@keyframes burst{0%,40%{opacity:0;transform:scale(.6)}55%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.2)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.bob{animation:bob 3s ease-in-out infinite}.bob2{animation:bob 3.6s ease-in-out .6s infinite}.sway{animation:sway 3s ease-in-out infinite;transform-origin:50% 85%}
.tw{animation:twinkle 2s ease-in-out infinite}.tw2{animation:twinkle 2.6s ease-in-out .7s infinite}
.blink{animation:blink 4.5s infinite;transform-origin:center;transform-box:fill-box}
.s1{animation:twinkle 2.2s ease-in-out infinite}.s2{animation:twinkle 2.2s ease-in-out .2s infinite}.s3{animation:twinkle 2.2s ease-in-out .4s infinite}.s4{animation:twinkle 2.2s ease-in-out .6s infinite}.s5{animation:twinkle 2.2s ease-in-out .8s infinite}
.dance{animation:dance 1.1s ease-in-out infinite;transform-origin:50% 90%}
.armL{animation:armL .55s ease-in-out infinite;transform-origin:100% 100%;transform-box:fill-box}.armR{animation:armR .55s ease-in-out infinite;transform-origin:0% 100%;transform-box:fill-box}
.kickL{animation:kickL .55s ease-in-out infinite;transform-origin:50% 0%;transform-box:fill-box}.kickR{animation:kickR .55s ease-in-out infinite;transform-origin:50% 0%;transform-box:fill-box}
.pop{animation:pop .5s ease-out both}
.clapL{animation:clapL 1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.clapR{animation:clapR 1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.burst{animation:burst 1s ease-out infinite;transform-box:fill-box;transform-origin:center}
.breathe{animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 60%}.beat{animation:beat 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.rise{animation:rise .35s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
footer.site{margin-top:auto;padding-top:20px;text-align:center;font-size:11px;color:var(--mute);line-height:1.5}
</style>
