# Render Blueprint: Render → New → Blueprint → pick this repo.
# It asks for ANTHROPIC_API_KEY, ADMIN_PASSWORDS and NOTION_TOKEN when you create it.
services:
  - type: web
    name: review-grader
    runtime: node
    plan: starter            # needed for the disk that keeps the counter; "free" works but the counter resets on every restart
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_PASSWORDS     # "BN Admin=pass1,HoR Admin=pass2,Owner Admin=pass3"
        sync: false
      - key: SESSION_SECRET      # any long random text; keeps staff logged in across restarts
        generateValue: true
      - key: NOTION_TOKEN        # Notion integration secret; Reviews and Staff databases must be shared with it
        sync: false
      - key: MODEL
        value: claude-sonnet-5
      - key: DAILY_LIMIT
        value: "100"
      - key: STATS_FILE
        value: /var/data/stats.json
    disk:
      name: review-grader-data
      mountPath: /var/data
      sizeGB: 1
